<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Art contact sheet</title>
<style>
  body { margin: 0; padding: 16px; background: #eceae4; font: 13px/1.4 system-ui, sans-serif; color: #333; }
  h2 { margin: 20px 0 8px; font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  figure { margin: 0; background: #fff; position: relative; overflow: hidden; }
  figure img { display: block; }
  figcaption { position: absolute; left: 6px; bottom: 4px; font-size: 11px; color: #999; }
  .stack img { position: absolute; left: 0; top: 0; }
  label { display: inline-flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<label><input id="guides" type="checkbox" /> show guides (templates/art)</label>
<div id="out"></div>
<script type="module">
  import { toFrame } from '/src/toy/poses.ts'
  const c = await fetch('/art/bag.json').then((r) => r.json())
  const out = document.getElementById('out')
  const guides = document.getElementById('guides')
  const base = () => (guides.checked ? '/templates/art/' : '/art/')
  const S = 300 / c.frameSize[0]
  const stack = (layers) => `<figure class="stack" style="width:300px;height:300px">${layers}</figure>`
  const img = (src) => `<img src="${base()}${src}" width="300" />`
  function render() {
    const fig = (src, w, cap) => `<figure><img src="${base()}${src}" width="${w}" /><figcaption>${cap}</figcaption></figure>`
    const homed = Object.entries(c.homes).map(([id, h]) => {
      const s = c.items[id]
      const f = toFrame(h)
      const k = S * f.scale * h.scale
      return `<img src="/art/${h.image}" style="width:${s.size[0] * S}px;transform-origin:${s.pivot[0] * S}px ${s.pivot[1] * S}px;transform:translate(${f.x * S - s.pivot[0] * S}px,${f.y * S - s.pivot[1] * S}px) rotate(${h.rot}deg) scale(${k / S})" />`
    }).join('')
    out.innerHTML =
      `<h2>Upright (shadow + back + homed items + front)</h2><div class="row">` +
      stack(img(c.upright.shadow) + img(c.upright.back) + homed + img(c.upright.front)) +
      fig(c.upright.back, 300, 'back') + fig(c.upright.front, 300, 'front') + `</div>` +
      `<h2>Fall (with shadow)</h2><div class="row">${c.fall.map((f) => stack(img(f.shadow) + img(f.src)) .replace('</figure>', `<figcaption>${f.f} · hold ${f.hold} · ${f.angle}°</figcaption></figure>`)).join('')}</div>` +
      `<h2>Righting (empty frames)</h2><div class="row">${c.right.map((f) => fig(f.src, 300, `${f.f} · ${f.angle}°`)).join('')}</div>` +
      `<h2>Items</h2><div class="row">${Object.values(c.items).flatMap((s) => Object.values(s.frames).map((p) => fig(p, s.size[0], p.split('/').pop()))).join('')}</div>`
  }
  guides.onchange = render
  render()
</script>
</body>
</html>
