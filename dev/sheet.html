<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Art contact sheet</title>
<style>
  body { margin: 0; padding: 16px; background: #eceae4; font: 13px/1.4 system-ui, sans-serif; color: #333; }
  h2 { margin: 20px 0 8px; font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  figure { margin: 0; background: #fff; position: relative; }
  figure img { display: block; }
  figcaption { position: absolute; left: 6px; bottom: 4px; font-size: 11px; color: #999; }
  .stack { position: relative; }
  .stack img + img { position: absolute; inset: 0; }
  label { display: inline-flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<label><input id="guides" type="checkbox" checked /> show guides (templates/art)</label>
<div id="out"></div>
<script type="module">
  const c = await fetch('/art/bag.json').then((r) => r.json())
  const out = document.getElementById('out')
  const guides = document.getElementById('guides')
  const base = () => (guides.checked ? '/templates/art/' : '/art/')
  function render() {
    const fig = (src, w, cap) => `<figure><img src="${base()}${src}" width="${w}" /><figcaption>${cap}</figcaption></figure>`
    const homed = Object.entries(c.homes).map(([id, h]) => {
      const s = c.items[id]
      const k = 300 / c.frameSize[0]
      return `<img src="/art/${h.image}" style="position:absolute;left:0;top:0;width:${s.size[0] * k}px;transform-origin:${s.pivot[0] * k}px ${s.pivot[1] * k}px;transform:translate(${(h.x - s.pivot[0]) * k}px,${(h.y - s.pivot[1]) * k}px) rotate(${h.rot}deg)" />`
    }).join('')
    out.innerHTML =
      `<h2>Upright (back + homed items + front)</h2><div class="row">` +
      `<figure class="stack" style="width:300px;height:300px"><img src="${base()}${c.upright.back}" width="300" />${homed}<img src="${base()}${c.upright.front}" width="300" /></figure>` +
      fig(c.upright.back, 300, 'back') + fig(c.upright.front, 300, 'front') + `</div>` +
      `<h2>Fall</h2><div class="row">${c.fall.map((f) => fig(f.src, 300, `${f.f} · hold ${f.hold}`)).join('')}</div>` +
      `<h2>Righting</h2><div class="row">${c.right.map((f) => fig(f.src, 300, `${f.f} · ${f.angle}°`)).join('')}</div>` +
      `<h2>Items</h2><div class="row">${Object.values(c.items).flatMap((s) => [...Object.values(s.frames), ...(s.highlight ? [s.highlight] : [])].map((p) => fig(p, s.size[0], p.split('/').pop()))).join('')}</div>`
  }
  guides.onchange = render
  render()
</script>
</body>
</html>
